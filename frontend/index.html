<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CLAD · 远程工作台</title><link rel="stylesheet" href="/static/style.css"><body>
<aside><h1>CLAD</h1><p>远程工作台</p><button id="new">＋ 新建会话</button><nav id="sessions" aria-label="历史会话"></nav><button id="pair">绑定设备</button><button id="logout">退出登录</button></aside>
<main><header><div><small>WORKSPACE</small><h2 id="title">从一个需求开始</h2></div><select id="devices" aria-label="执行设备"><option value="">尚未绑定设备</option></select></header><p id="notice" role="status"></p><section id="messages" aria-live="polite"><div class="empty"><h2>把工作交给你的电脑</h2><p>绑定设备，描述需求，在这里查看执行结果并继续对话。</p></div></section><section id="files" aria-label="生成文件"></section><details><summary>执行日志</summary><pre id="logs"></pre></details><form id="compose"><textarea id="prompt" placeholder="描述工作需求…" aria-label="工作需求" required></textarea><div><span id="status">准备就绪</span><button type="button" id="stop" disabled>停止执行</button><button id="send">发送需求</button></div></form></main>
<dialog id="login"><form id="loginForm"><h2>登录 CLAD</h2><p>连接设备，继续你的工作。</p><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><p id="error" role="alert"></p><button>登录</button></form></dialog><script src="/static/app.js"></script></body></html>
